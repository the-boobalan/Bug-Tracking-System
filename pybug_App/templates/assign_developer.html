{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Developer | BTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4285F4;
            --g-red: #EA4335;
            --g-green: #34A853;
            --g-yellow: #FBBC05;
            --sidebar-width: 280px;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);

            /* Dark Theme Map */
            --bg-body: #000;
            --sidebar-bg: rgba(10, 10, 10, 0.4);
            --card-bg: rgba(15, 15, 15, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-main: #f5f5f7;
            --text-dim: #86868b;
            --mesh-1: rgba(66, 133, 244, 0.1);
            --mesh-2: rgba(52, 168, 83, 0.05);
            --input-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-body: #f5f5f7;
            --sidebar-bg: rgba(255, 255, 255, 0.6);
            --card-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #1d1d1f;
            --text-dim: #6e6e73;
            --mesh-1: rgba(66, 133, 244, 0.05);
            --mesh-2: rgba(52, 168, 83, 0.03);
            --input-bg: rgba(0, 0, 0, 0.02);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; display: flex; 
            background: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, var(--mesh-1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--mesh-2) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width); 
            background: var(--sidebar-bg);
            backdrop-filter: blur(40px); 
            position: fixed; height: 100%;
            padding: 50px 0; display: flex; flex-direction: column;
            border-right: 1px solid var(--glass-border); 
            z-index: 100;
        }

        .sidebar h2 { 
            font-family: 'Product Sans', sans-serif; 
            padding: 0 35px; font-size: 26px; font-weight: 700;
            letter-spacing: -1px; margin-bottom: 60px; 
            background: linear-gradient(135deg, var(--text-main) 0%, var(--text-dim) 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sidebar a {
            padding: 18px 35px; color: var(--text-dim); text-decoration: none;
            display: flex; align-items: center; gap: 15px;
            font-size: 14px; font-weight: 500; transition: var(--transition);
            border-left: 3px solid transparent;
        }

        .sidebar a:hover { color: var(--text-main); padding-left: 40px; }
        .sidebar a.active { color: var(--primary); background: rgba(66, 133, 244, 0.08); border-left-color: var(--primary); }

        /* --- Main Content --- */
        .content { 
            margin-left: var(--sidebar-width); 
            padding: 80px; 
            width: calc(100% - var(--sidebar-width));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
        }

        .header-title {
            font-family: 'Product Sans', sans-serif;
            background: linear-gradient(to bottom, var(--text-main) 40%, var(--text-dim) 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 42px; font-weight: 700; letter-spacing: -1.5px;
            margin-bottom: 10px; text-align: center;
        }

        /* --- The Glowing Form Card --- */
        .section-card {
            background: var(--card-bg); 
            border-radius: 28px; 
            border: 1px solid var(--glass-border);
            position: relative;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
            width: 100%;
        }

        /* Multi-color Google Glow */
        .section-card::before {
            content: "";
            position: absolute;
            inset: -1.5px; 
            border-radius: 29px; 
            padding: 1.5px; 
            background: linear-gradient(135deg, var(--primary), var(--g-red), var(--g-yellow), var(--g-green));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: -1;
        }

        .section-card:hover::before { opacity: 1; }

        /* --- Form Elements --- */
        .form-group { margin-bottom: 25px; }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 10px;
            margin-left: 5px;
        }

        select, input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: var(--transition);
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            background: var(--text-main);
            color: var(--bg-body);
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.2);
        }

        #themeToggle {
            position: fixed; top: 40px; right: 40px;
            cursor:pointer; background: var(--card-bg); padding: 12px; 
            border-radius: 50%; border: 1px solid var(--glass-border);
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); z-index: 1000;
        }
        #themeToggle:hover { transform: rotate(15deg) scale(1.1); }

        @media (max-width: 760px) {
            body { display: block; }
            .sidebar { position: static; width: 100%; height: auto; padding: 10px; flex-direction: row; overflow-x: auto; white-space: nowrap; }
            .sidebar h2 { margin: 0; padding: 0 12px; }
            .sidebar a { flex: 0 0 auto; padding: 10px 12px; font-size: 12px; }
            .content { margin-left: 0; width: 100%; padding: 24px 14px; }
            .form-container { max-width: none; }
            .section-card { padding: 22px 16px; }
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>

    <nav class="sidebar">
        <h2>BTS</h2>
        <a href="{% url 'dashboard' %}"><span>🏠</span> Dashboard</a>
        <a href="{% url 'create_team' %}"><span>➕</span> Create Team</a>
        <a href="{% url 'manager_bug_list' %}" class="active">Bug Report</a>
        <a href="{% url 'logout' %}" style="margin-top: auto; color: var(--g-red); opacity: 0.7;">🚪 Logout</a>
    </nav>

    <div id="themeToggle">🌙</div>

    <div class="content">
        <div class="form-container">
            <h1 class="header-title">Assign Developer</h1>
            <p style="text-align: center; color: var(--text-dim); margin-bottom: 40px;">Allocate technical resources to resolve identified issues.</p>

            <div class="section-card">
                <form method="post">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Developer</label>
                        <select name="developer_name" required>
                            <option value="">Select Developer</option>
                            {% for dev in developers %}
                            <option value="{{ dev.id }}">{{ dev.username }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Bug</label>
                        <select name="bug_name" required>
                            <option value="">Select Bug</option>
                            {% for bug in bugs %}
                            <option value="{{ bug.id }}">{{ bug.title }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <select name="priority" required>
                            <option value="">Select Priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Assign Bug to Developer</button>
                </form>
            </div>
            
            <a href="{% url 'dashboard' %}" style="display: block; text-align: center; margin-top: 30px; color: var(--text-dim); text-decoration: none; font-size: 14px;">
                ← Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('bts-theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('bts-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '🌙' : '☀️';
        });
    </script>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
